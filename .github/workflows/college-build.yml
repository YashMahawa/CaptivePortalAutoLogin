name: College APK and Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: college-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'YashMahawa/CaptivePortalAutoLogin'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Restore durable signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'college-release.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE']))
          key.chmod(0o600)
          props = Path('keystore.properties')
          props.write_text(f'storeFile={key}\nstorePassword={os.environ["STORE_PASSWORD"]}\nkeyAlias={os.environ["KEY_ALIAS"]}\nkeyPassword={os.environ["KEY_PASSWORD"]}\n')
          props.chmod(0o600)
          PY
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :portal-login:test :linux:test :app:testArm64ReleaseUnitTest :app:assembleArm64Release :app:assembleX86_64Release :linux:shadowJar --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process
      - name: Check packaged Linux CLI
        run: |
          java -jar linux/build/libs/linux-shadow.jar --help
          java -jar linux/build/libs/linux-shadow.jar --iitj --oneshot --profile /tmp/missing-profile > /tmp/linux-missing-profile.txt 2>&1 && exit 1 || test "$?" -ne 0
          grep -q 'Configure an IITJ profile' /tmp/linux-missing-profile.txt
      - name: Validate shipped arm64 APK
        run: python3 scripts/verify-arm64-apk.py app/build/outputs/apk/arm64/release/app-arm64-release.apk ${{ github.event_name != 'pull_request' && '--release' || '' }}
      - name: Build different-signer installation fixture
        run: bash scripts/build-install-fixture.sh
      - name: Package downloads
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/arm64/release/app-arm64-release.apk dist/CaptivePortalAutoLogin-arm64-v8a.apk
          python3 scripts/package-linux.py dist/CaptivePortalAutoLogin-Linux.zip
          cp app/build/outputs/apk/x86_64/release/app-x86_64-release.apk smoke-fixture/app-x86_64-release.apk
      - name: Build and validate direct native-library alternatives
        run: |
          ./gradlew :app:assembleArm64Release :app:assembleX86_64Release -PdirectNativeLibraries=true --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process
          python3 scripts/verify-arm64-apk.py app/build/outputs/apk/arm64/release/app-arm64-release.apk --direct ${{ github.event_name != 'pull_request' && '--release' || '' }}
          cp app/build/outputs/apk/arm64/release/app-arm64-release.apk dist/CaptivePortalAutoLogin-arm64-v8a-direct.apk
          cp app/build/outputs/apk/x86_64/release/app-x86_64-release.apk smoke-fixture/app-x86_64-direct.apk
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Upload downloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: college-downloads
          path: dist/*
          retention-days: 90
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testArm64ReleaseUnitTest/
            portal-login/build/reports/tests/test/
            linux/build/reports/tests/test/
          if-no-files-found: ignore
      - name: Upload emulator APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: emulator-apks
          path: |
            smoke-fixture/*.apk
          retention-days: 7
      - name: Remove signing files
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/college-release.jks"

  recorder-smoke:
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: emulator-apks
          path: emulator-download
      - name: Prepare emulator and local portal
        run: |
          sudo chmod 666 /dev/kvm
          mkdir -p smoke-apks
          find emulator-download -name '*.apk' -exec cp {} smoke-apks/ \;
          python3 scripts/smoke-portal.py > portal-fixture.log 2>&1 &
      - name: Exercise the release recorder and manual login
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/run-recorder-smoke.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recorder-smoke-results-api-${{ matrix.api-level }}
          path: |
            smoke-result.txt
            recorder-logcat.txt
            portal-fixture.log
          if-no-files-found: ignore

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, recorder-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: college-downloads
          path: dist
      - name: Publish durable test-build downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
          BUILD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Source commit: %s\n\nBuild and unit-test results: %s\n\nCompatibility build: v1/v2/v3 signatures with the same release key. The regular APK keeps native libraries compressed for a smaller download. The larger -direct.apk loads 16 KB-aligned native libraries directly without installer extraction. Both package formats are exercised on Android 15 and 16. Vivo installation is not yet confirmed; report the full installer error if it still fails. The original UI, back-navigation and inset fixes are retained. IITJ compatibility: fresh campus probe tokens, literal JavaScript/meta refresh redirects, cookies and magic/4Tredir form fields. An optional certificate exception is limited to gateway.iitj.ac.in:1003 and netaccess.iitj.ac.in HTTPS. Browser failures now show an error and retry page. The uploaded helper describes the older gateway flow; the live netaccess 24online form is not confirmed.\n\nAndroid arm64 APK and Linux CLI ZIP. These are test builds; successful compilation and unit tests do not verify a particular college portal.\n' "$BUILD_SHA" "$RUN_URL" > release-notes.txt
          gh release create "$BUILD_TAG" dist/* --target "$BUILD_SHA" --prerelease --title "College test build $BUILD_TAG" --notes-file release-notes.txt
